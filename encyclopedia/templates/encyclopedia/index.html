{% extends "encyclopedia/layout.html" %}

{% block title %} Encyclopedia {% endblock %}

{% block body %}
    <h1>All Pages</h1>

    <ul>
        {% for entry in entries %}
            <li id="item"><a id="enty_pges" href="{% url 'wiki:entry' entry %}">{{ entry }}</a></li>
        {% endfor %}
    </ul>

{% endblock %}
