{% extends "encyclopedia/layout.html" %}

{% block title %}Edit {{ title }}{% endblock %}

{% block body %}
<form action="{% url 'wiki:edit' title=title %}" method="post" class="frm">
    {% csrf_token %}

    <h1>{{ title }}</h1>
    {{ form.title.as_hidden }}
    {{ form.content }}

    <input type="submit" value="Save changes" id="btn">
</form>
{% endblock %}
