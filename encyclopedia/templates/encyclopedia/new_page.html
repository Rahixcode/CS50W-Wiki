{% extends "encyclopedia/layout.html" %}

{% block title %} Add New Page {% endblock %}

{% block body %}
<form action="{% url 'wiki:page' %}" method="post" class="frm">
    {% csrf_token %}

    <h1>Title</h1>
    {{ form.title }}
    {{ form.title.errors }}

    <h2>Content</h2>
    {{ form.content }}

    <input type="submit" value="New entry" id="btn">
</form>
{% endblock %}
